<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
  <defs>
    <linearGradient id="bg-compact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glow-c" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-sm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-opacity="0.12" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Border and background -->
  <rect width="800" height="180" rx="16" fill="url(#bg-compact)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="800" height="180" rx="16" fill="url(#grid-sm)" />
  <circle cx="120" cy="90" r="140" fill="url(#glow-c)" />

  <!-- Logo and Branding -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 15 23 L 23 15 L 31 23 L 23 31 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="23" cy="23" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Text Content -->
  <g transform="translate(105, 45)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      NexusPulse <tspan fill="url(#title-grad)">EdgeSaaS Boilerplate</tspan>
    </text>
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Zero-Cold-Start Micro-SaaS on Cloudflare Workers • Hono v4.6 • Stripe Billing • Web Crypto Auth
    </text>
  </g>

  <!-- Stat Badges Row -->
  <g transform="translate(105, 118)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">⚡ &lt;15ms Latency</text>

    <rect x="142" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="154" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4ade80">💰 $0.00 Idle Cost</text>

    <rect x="289" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="301" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fb923c">🚀 0ms Cold Start</text>

    <rect x="436" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="448" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a855f7">💳 Turnkey Stripe</text>
  </g>
</svg>
